document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

'woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'EB Garamond';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"fc84ef6b-978f-4fa2-bfe0-b4a63a29f50a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>:root{\n  --ink:#2a1a08; --paper:#f5efe1; --ink-soft:#3a3530;\n  --serif:'EB Garamond',Georgia,serif; --hand:'Caveat',cursive;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;background:var(--paper)}\nhtml{height:100%}\nbody{font-family:var(--serif);color:var(--ink);overflow:hidden}\n\n.app{display:flex;flex-direction:column;width:100%;height:100dvh;height:var(--vh,100dvh);overflow:hidden}\n.masthead{flex:0 0 auto;text-align:center;padding:clamp(6px,1.5vh,14px) 16px clamp(2px,.6vh,6px);position:relative;z-index:2}\n.mast-title{font-family:var(--hand);font-weight:600;font-size:clamp(28px,4.6vw,58px);line-height:1}\n.mast-sub{font-style:italic;color:var(--ink-soft);opacity:.75;margin-top:2px;font-size:clamp(13px,1.4vw,18px);padding:0 12px;text-wrap:balance}\n\n/* Scene fills remaining viewport; SVG scales to fit both axes, perfectly centered */\n.stage{flex:1 1 auto;position:relative;padding:clamp(4px,1vh,12px) clamp(8px,2vw,24px);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}\n#scene{width:100%;height:100%;max-width:100%;max-height:100%;display:block;margin:auto}\n\n/* Interactivity on SVG groups */\n.clickable{cursor:grab;transition:transform .25s ease}\n.clickable:active{cursor:grabbing}\n.clickable:hover{transform:translateY(-3px)}\n#paper.clickable:hover{transform:translateY(-3px) rotate(-.5deg)}\nbody.grabbing,body.grabbing *{cursor:grabbing!important}\n#fishbowl.clickable:hover{transform:translateY(-2px)}\n#jar.clickable:hover{transform:translateY(-3px)}\n\n/* Wave animation */\n.wave{transform-box:fill-box}\n.wave1{animation:wave 6s ease-in-out infinite}\n.wave2{animation:wave 7.5s ease-in-out infinite reverse}\n@keyframes wave{\n  0%,100%{transform:translateX(0)}\n  50%{transform:translateX(-20px)}\n}\n\n/* Bubbles */\n.bub{transform-box:fill-box;opacity:0}\n.b1{animation:bubble 4s ease-in 0s infinite}\n.b2{animation:bubble 5.5s ease-in 1.3s infinite}\n.b3{animation:bubble 4.8s ease-in 2.6s infinite}\n.b4{animation:bubble 6s ease-in .8s infinite}\n@keyframes bubble{\n  0%{opacity:0;transform:translateY(0) scale(.8)}\n  15%{opacity:.8}\n  100%{opacity:0;transform:translateY(-120px) scale(1.2)}\n}\n\n/* Fish swimming — transform in SVG user-units via translate */\n.fish{transform-box:fill-box}\n.fish-1{animation:swim1 10s ease-in-out infinite}\n.fish-2{animation:swim2 13s ease-in-out infinite}\n@keyframes swim1{\n  0%   {transform:translate(260px,470px) scaleX(1)}\n  24%  {transform:translate(410px,460px) scaleX(1)}\n  25%  {transform:translate(410px,460px) scaleX(-1)}\n  49%  {transform:translate(270px,510px) scaleX(-1)}\n  50%  {transform:translate(270px,510px) scaleX(1)}\n  74%  {transform:translate(400px,530px) scaleX(1)}\n  75%  {transform:translate(400px,530px) scaleX(-1)}\n  100% {transform:translate(260px,470px) scaleX(-1)}\n}\n@keyframes swim2{\n  0%   {transform:translate(400px,530px) scaleX(-1)}\n  33%  {transform:translate(280px,550px) scaleX(-1)}\n  34%  {transform:translate(280px,550px) scaleX(1)}\n  66%  {transform:translate(410px,485px) scaleX(1)}\n  67%  {transform:translate(410px,485px) scaleX(-1)}\n  100% {transform:translate(400px,530px) scaleX(-1)}\n}\n\n/* Pen rocks gently */\n#pen{transform-origin:560px 690px;animation:penRock 6s ease-in-out infinite}\n@keyframes penRock{\n  0%,100%{transform:translate(560px,690px) rotate(0deg)}\n  50%   {transform:translate(560px,690px) rotate(2deg)}\n}\n\n/* Plant stems sway */\n.plant-stems{transform-origin:816px 698px;transform-box:view-box;animation:sway 5s ease-in-out infinite}\n@keyframes sway{\n  0%,100%{transform:rotate(-1.5deg)}\n  50%   {transform:rotate(2deg)}\n}\n/* Flowers follow the sway, slightly bigger amplitude for a looser head-on-stem feel */\n.plant-flowers{transform-origin:820px 696px;transform-box:view-box;animation:swayHead 5s ease-in-out infinite}\n@keyframes swayHead{\n  0%,100%{transform:rotate(-2.4deg)}\n  48%    {transform:rotate(2.8deg)}\n  52%    {transform:rotate(2.9deg)}\n}\n\n/* paper click flex */\n#paper{transform-origin:465px 715px}\n#paper.clickable:active{transform:scale(.99)}\n\n/* overlays */\n.overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px}\n.overlay.open{display:flex}\n.overlay-scrim{position:absolute;inset:0;background:rgba(30,24,16,.4);backdrop-filter:blur(4px)}\n\n.big-paper{position:relative;width:min(640px,94vw);background:#fbf4e2;border-radius:4px;padding:0;animation:pin .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 60px -20px rgba(30,20,10,.4);clip-path:polygon(2% 4%, 10% 2%, 22% 5%, 34% 2%, 48% 6%, 62% 3%, 75% 6%, 88% 3%, 98% 8%, 97% 94%, 85% 96%, 70% 92%, 55% 96%, 40% 92%, 25% 96%, 12% 92%, 3% 95%)}\n@keyframes pin{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}\n.paper-inner{padding:36px clamp(28px,5vw,52px);display:flex;flex-direction:column;min-height:360px}\n.paper-label{font-family:var(--hand);font-size:clamp(26px,3vw,36px);line-height:1.1;margin-bottom:14px}\n.paper-label.small{font-size:clamp(22px,2.2vw,28px);opacity:.8}\n#advice-input{width:100%;min-height:140px;background:transparent;border:none;resize:none;outline:none;font-family:var(--hand);font-size:clamp(22px,2.3vw,28px);line-height:1.45;color:var(--ink);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.4 n:center;color:var(--ink)}\n.folded-note:active{cursor:grabbing}\n.folded-note svg{width:100%;height:auto}\n.folded-hint,.jar-hint{font-family:var(--hand);font-size:18px;opacity:.6;margin-top:4px}\n.mini-jar{width:140px;justify-self:center;border:1.5px dashed rgba(60,45,30,.35);border-radius:14px;padding:10px;text-align:center;color:var(--ink);transition:background .2s,border-color .2s,transform .2s}\n.mini-jar.over{background:rgba(60,45,30,.08);border-color:var(--ink);transform:scale(1.03)}\n.mini-jar svg{width:100%;height:auto}\n.thanks{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}\n.thanks-big{font-family:var(--hand);font-size:clamp(46px,6vw,68px);line-height:1}\n.thanks-small{font-style:italic;color:var(--ink-soft)}\n\n.unfold-stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(640px,94vw)}\n.unfolded-note{width:100%;animation:unfold .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 30px 60px -20px rgba(30,20,10,.35));--note-color:#fbf4e2}\n@keyframes unfold{0%{opacity:0;transform:scale(.2) rotate(-18deg) translateY(-200px)}40%{opacity:1;transform:scale(.5) rotate(6deg)}70%{transform:scale(1.04) rotate(-1deg)}100%{transform:scale(1)}}\n.note-paper{background:var(--note-color,#fbf4e2);padding:48px 40px;min-height:240px;display:flex;align-items:center;justify-content:center;clip-path:polygon(2% 4%, 10% 2%, 22% 5%, 34% 2%, 48% 6%, 62% 3%, 75% 6%, 88% 3%, 98% 8%, 97% 94%, 85% 96%, 70% 92%, 55% 96%, 40% 92%, 25% 96%, 12% 92%, 3% 95%)}\n.note-text{font-family:var(--hand);font-size:clamp(24px,2.5vw,30px);line-height:1.45;text-align:center;color:var(--ink);text-wrap:pretty}\n.note-meta{display:flex;gap:12px;align-items:center;width:100%;padding:0 4px}\n.byline{font-style:italic;color:#f5efe1;font-size:15px;margin-right:auto;opacity:.8}\n\n.author-bar{position:fixed;left:14px;bottom:14px;z-index:60;display:flex;gap:8px;align-items:center;padding:6px 10 path>\n        <!-- leaves -->\n        <path d=\"M 820 620 q -16 -8 -26 4 q 12 12 26 -4 z\" fill=\"#f5efe1\"><\u002Fpath>\n        <path d=\"M 852 608 q 20 -10 30 6 q -16 12 -30 -6 z\" fill=\"#f5efe1\"><\u002Fpath>\n      <\u002Fg>\n      <!-- daisy flowers (drawn after stems so they sit on top) -->\n      <g class=\"plant-flowers\" stroke=\"#2a1a08\" stroke-width=\"1.8\" fill=\"#f5efe1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" filter=\"url(#wob2)\">\n        <!-- flower 1: left, 6 rounded petals + center dot cluster -->\n        <g transform=\"translate(787 556)\">\n          <circle cx=\"0\" cy=\"-14\" r=\"6\"><\u002Fcircle>\n          <circle cx=\"13\" cy=\"-7\" r=\"6\"><\u002Fcircle>\n          <circle cx=\"13\" cy=\"7\" r=\"6\"><\u002Fcircle>\n          <circle cx=\"0\" cy=\"14\" r=\"6\"><\u002Fcircle>\n          <circle cx=\"-13\" cy=\"7\" r=\"6\"><\u002Fcircle>\n          <circle cx=\"-13\" cy=\"-7\" r=\"6\"><\u002Fcircle>\n          <circle r=\"5\" fill=\"#2a1a08\" stroke=\"none\"><\u002Fcircle>\n          <g fill=\"#2a1a08\" stroke=\"none\"><circle cx=\"-1\" cy=\"-1\" r=\".9\"><\u002Fcircle><circle cx=\"1.5\" cy=\"1\" r=\".9\"><\u002Fcircle><circle cx=\"-1.8\" cy=\"1.6\" r=\".8\"><\u002Fcircle><\u002Fg>\n        <\u002Fg>\n        <!-- flower 2: center tall, bigger -->\n        <g transform=\"translate(839 540)\">\n          <circle cx=\"0\" cy=\"-17\" r=\"7.5\"><\u002Fcircle>\n          <circle cx=\"16\" cy=\"-8\" r=\"7.5\"><\u002Fcircle>\n          <circle cx=\"16\" cy=\"8\" r=\"7.5\"><\u002Fcircle>\n          <circle cx=\"0\" cy=\"17\" r=\"7.5\"><\u002Fcircle>\n          <circle cx=\"-16\" cy=\"8\" r=\"7.5\"><\u002Fcircle>\n          <circle cx=\"-16\" cy=\"-8\" r=\"7.5\"><\u002Fcircle>\n          <circle r=\"6\" fill=\"#2a1a08\" stroke=\"none\"><\u002Fcircle>\n          <g fill=\"#2a1a08\" stroke=\"none\"><circle cx=\"-1.2\" cy=\"-1.2\" r=\"1\"><\u002Fcircle><circle cx=\"1.6\" cy=\"1\" r=\"1\"><\u002Fcircle><circle cx=\"-1.8\" cy=\"2\" r=\"1 button>\n          <button class=\"btn\" id=\"to-preview\" disabled=\"\">preview →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"paper-step\" data-step=\"preview\" hidden=\"\">\n        <div class=\"paper-label small\">read it back…<\u002Fdiv>\n        <div class=\"preview-text\" id=\"preview-text\"><\u002Fdiv>\n        <div class=\"paper-actions\">\n          <button class=\"btn ghost\" id=\"back-edit\">← edit<\u002Fbutton>\n          <button class=\"btn\" id=\"to-fold\">looks right →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"paper-step\" data-step=\"drop\" hidden=\"\">\n        <div class=\"paper-label small\">fold it in — drag into the jar<\u002Fdiv>\n        <div class=\"drop-stage\">\n          <div class=\"folded-note\" id=\"folded-note\" tabindex=\"0\">\n            <svg viewBox=\"0 0 120 80\"><g fill=\"#fbf4e2\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n              <path d=\"M 8 10 q 30 -6 104 0 l -4 60 q -50 6 -104 0 z\"><\u002Fpath>\n              <path d=\"M 20 26 l 80 -2\"><\u002Fpath><path d=\"M 20 38 l 72 -2\"><\u002Fpath><path d=\"M 20 50 l 64 -2\"><\u002Fpath>\n            <\u002Fg><\u002Fsvg>\n            <div class=\"folded-hint\">drag me →<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"mini-jar\" id=\"mini-jar\">\n            <svg viewBox=\"0 0 160 200\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n              <ellipse cx=\"80\" cy=\"26\" rx=\"44\" ry=\"6\"><\u002Fellipse>\n              <path d=\"M 36 26 v 12 a 44 6 0 0 0 88 0 v -12\"><\u002Fpath>\n              <path d=\"M 40 58 C 26 72, 22 110, 24 148 C 26 180, 36 192, 46 194 L 114 194 C 124 192, 134 180, 136 148 C 138 110, 134 72, 120 58 Z\"><\u002Fpath>\n            <\u002Fg><\u002Fsvg>\n            <div class=\"jar-hint\">drop here<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"paper-step\" data-step=\"thanks\" hidden=\"\">\n        <div class=\"thanks\">\n          <div class=\"thanks-big\">thank you.<\u002Fdiv>\n          <div class=\"thanks-small\">your words are now in the jar.<\u002Fdiv>\n          <button class=\"btn\" id=\"thanks-close\">close<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ───── READ OVERLAY ───── -->\n<div id=\"read-overlay\" class=\"overlay\" aria-hidden=\"true\">\n  <div class=\"overlay-scrim\"><\u002Fdiv>\n  <div class=\"unfold-stage\">\n    <div class=\"unfolded-note\" id=\"unfolded-note\" style=\"\">\n      <div class=\"note-paper\">\n        <div class=\"note-text\" id=\"note-text\">Your body is not a project to be finished. It is the home you live in.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"note-meta\">\n        <span class=\"byline\">— from the jar<\u002Fspan>\n        <button class=\"btn ghost small\" id=\"draw-again\">pull another<\u002Fbutton>\n        <button class=\"btn small\" id=\"read-close\">put it back<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<script>\n(function(){function setVH(){document.documentElement.style.setProperty('--vh', window.innerHeight + 'px')}setVH();addEventListener('resize',setVH)})();\n<\u002Fscript>\n<script src=\"b4938c94-bd61-4835-b01a-acaf9193f193\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
