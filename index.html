<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiseJar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1a08; --paper:#f5efe1; --ink-soft:#3a3530;
  --serif:'EB Garamond',Georgia,serif; --hand:'Caveat',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#b0bfb5}
html{height:100%}
body{font-family:var(--serif);color:var(--ink);overflow:hidden;background:#b0bfb5}

.app{display:flex;flex-direction:column;width:100%;height:100dvh;height:var(--vh,100dvh);overflow:hidden}
.masthead{flex:0 0 auto;text-align:center;padding:clamp(6px,1.5vh,14px) 16px clamp(2px,.6vh,6px);position:relative;z-index:2}
.mast-title{font-family:var(--hand);font-weight:600;font-size:clamp(28px,4.6vw,58px);line-height:1}
.mast-sub{font-style:italic;color:var(--ink-soft);opacity:.75;margin-top:2px;font-size:clamp(13px,1.4vw,18px);padding:0 12px;text-wrap:balance}

/* Scene fills remaining viewport; SVG scales to fit both axes, perfectly centered */
.stage{flex:1 1 auto;position:relative;padding:clamp(4px,1vh,12px) clamp(8px,2vw,24px);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
#scene{width:100%;height:100%;max-width:100%;max-height:100%;display:block;margin:auto}

/* Notes pile jiggle on jar hover */
#jar-pile{transition:transform .25s ease-out;transform-origin:670px 610px;transform-box:fill-box}
#jar.clickable:hover #jar-pile{animation:pileJiggle .5s ease-out}
@keyframes pileJiggle{
  0%{transform:translate(0,0)}
  20%{transform:translate(-.6px,-1px) rotate(-.3deg)}
  45%{transform:translate(.8px,-.4px) rotate(.2deg)}
  70%{transform:translate(-.4px,.3px) rotate(-.15deg)}
  100%{transform:translate(0,0)}
}

/* Interactivity on SVG groups */
.clickable{cursor:grab;transition:transform .25s ease}
.clickable:active{cursor:grabbing}
.clickable:hover{transform:translateY(-3px)}
#paper.clickable:hover{transform:translateY(-3px) rotate(-.5deg)}
body.grabbing,body.grabbing *{cursor:grabbing!important}
#fishbowl.clickable:hover{transform:translateY(-2px)}
#jar.clickable:hover{transform:translateY(-3px)}

/* Wave animation */
.wave{transform-box:fill-box}
.wave1{animation:wave 6s ease-in-out infinite}
.wave2{animation:wave 7.5s ease-in-out infinite reverse}
@keyframes wave{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(-20px)}
}

/* Bubbles */
.bub{transform-box:fill-box;opacity:0}
.b1{animation:bubble 4s ease-in 0s infinite}
.b2{animation:bubble 5.5s ease-in 1.3s infinite}
.b3{animation:bubble 4.8s ease-in 2.6s infinite}
.b4{animation:bubble 6s ease-in .8s infinite}
@keyframes bubble{
  0%{opacity:0;transform:translateY(0) scale(.8)}
  15%{opacity:.8}
  100%{opacity:0;transform:translateY(-120px) scale(1.2)}
}

/* Fish swimming */
.fish{transform-box:fill-box}

/* Pen rocks gently */
#pen{transform-origin:560px 690px;animation:penRock 6s ease-in-out infinite}
@keyframes penRock{
  0%,100%{transform:translate(560px,690px) rotate(0deg)}
  50%   {transform:translate(560px,690px) rotate(2deg)}
}

/* Plant stems sway */
.plant-stems{transform-origin:816px 698px;transform-box:view-box;animation:sway 5s ease-in-out infinite}
@keyframes sway{
  0%,100%{transform:rotate(-1.5deg)}
  50%   {transform:rotate(2deg)}
}
/* Flowers follow the sway */
.plant-flowers{transform-origin:820px 696px;transform-box:view-box;animation:swayHead 5s ease-in-out infinite}
@keyframes swayHead{
  0%,100%{transform:rotate(-2.4deg)}
  48%    {transform:rotate(2.8deg)}
  52%    {transform:rotate(2.9deg)}
}

/* paper click flex */
#paper{transform-origin:465px 715px}
#paper.clickable:active{transform:scale(.99)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.overlay-scrim{position:absolute;inset:0;background:rgba(30,24,16,.4);backdrop-filter:blur(4px)}

.big-paper{position:relative;width:min(640px,94vw);background:#fbf4e2;border-radius:4px;padding:0;animation:pin .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 60px -20px rgba(30,20,10,.4);clip-path:polygon(2% 4%, 10% 2%, 22% 5%, 34% 2%, 48% 6%, 62% 3%, 75% 6%, 88% 3%, 98% 8%, 97% 94%, 85% 96%, 70% 92%, 55% 96%, 40% 92%, 25% 96%, 12% 92%, 3% 95%)}
@keyframes pin{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.paper-inner{padding:36px clamp(28px,5vw,52px);display:flex;flex-direction:column;min-height:360px}
.paper-label{font-family:var(--hand);font-size:clamp(26px,3vw,36px);line-height:1.1;margin-bottom:14px}
.paper-label.small{font-size:clamp(22px,2.2vw,28px);opacity:.8}
#advice-input{width:100%;min-height:140px;background:transparent;border:none;resize:none;outline:none;font-family:var(--hand);font-size:clamp(22px,2.3vw,28px);line-height:1.45;color:var(--ink);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.45em - 1px),rgba(60,45,30,.18) calc(1.45em - 1px),rgba(60,45,30,.18) 1.45em);background-position:0 .2em}
#advice-input::placeholder{color:var(--ink-soft);opacity:.45;font-style:italic}
.meter-row{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:14px;color:var(--ink-soft)}
.meter{flex:1;height:4px;background:rgba(60,45,30,.18);border-radius:2px;overflow:hidden}
.meter-fill{height:100%;width:0;background:var(--ink);transition:width .2s ease}
.meter.over .meter-fill{background:#a83b20}
.warn{color:#a83b20;font-style:italic;font-size:14px;min-height:20px;margin-top:4px}
.color-row{display:flex;align-items:center;gap:12px;margin-top:6px}
.color-row-label{font-family:var(--hand);font-size:18px;color:var(--ink-soft);font-style:italic}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(60,45,30,.25);cursor:pointer;padding:0;transition:transform .15s ease,border-color .15s ease;box-shadow:0 1px 3px rgba(30,20,10,.18)}
.swatch:hover{transform:scale(1.1)}
.swatch.sel{border-color:var(--ink);transform:scale(1.15);box-shadow:0 0 0 2px rgba(60,45,30,.08),0 1px 3px rgba(30,20,10,.2)}
.paper-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.btn{font-family:var(--hand);font-size:22px;background:var(--ink);color:var(--paper);border:none;padding:6px 18px 8px;border-radius:999px;cursor:pointer;transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{font-size:18px;padding:4px 14px 6px}
.preview-text{font-family:var(--hand);font-size:clamp(24px,2.6vw,30px);line-height:1.45;flex:1;padding:8px 0;overflow:auto}

.drop-stage{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:16px;flex:1;padding:10px 0}
.folded-note{width:140px;justify-self:center;cursor:grab;user-select:none;text-align:center;color:var(--ink)}
.folded-note:active{cursor:grabbing}
.folded-note svg{width:100%;height:auto}
.folded-hint,.jar-hint{font-family:var(--hand);font-size:18px;opacity:.6;margin-top:4px}
.mini-jar{width:140px;justify-self:center;border:1.5px dashed rgba(60,45,30,.35);border-radius:14px;padding:10px;text-align:center;color:var(--ink);transition:background .2s,border-color .2s,transform .2s}
.mini-jar.over{background:rgba(60,45,30,.08);border-color:var(--ink);transform:scale(1.03)}
.mini-jar svg{width:100%;height:auto}
.thanks{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.thanks-big{font-family:var(--hand);font-size:clamp(46px,6vw,68px);line-height:1}
.thanks-small{font-style:italic;color:var(--ink-soft)}

.unfold-stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(640px,94vw)}
.unfolded-note{width:100%;animation:unfold .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 30px 60px -20px rgba(30,20,10,.35));--note-color:#fbf4e2}
@keyframes unfold{0%{opacity:0;transform:scale(.2) rotate(-18deg) translateY(-200px)}40%{opacity:1;transform:scale(.5) rotate(6deg)}70%{transform:scale(1.04) rotate(-1deg)}100%{transform:scale(1)}}
.note-paper{background:var(--note-color,#fbf4e2);padding:48px 40px;min-height:240px;display:flex;align-items:center;justify-content:center;clip-path:polygon(2% 4%, 10% 2%, 22% 5%, 34% 2%, 48% 6%, 62% 3%, 75% 6%, 88% 3%, 98% 8%, 97% 94%, 85% 96%, 70% 92%, 55% 96%, 40% 92%, 25% 96%, 12% 92%, 3% 95%)}
.note-text{font-family:var(--hand);font-size:clamp(24px,2.5vw,30px);line-height:1.45;text-align:center;color:var(--ink);text-wrap:pretty}
.note-meta{display:flex;gap:12px;align-items:center;width:100%;padding:0 4px}
.byline{font-style:italic;color:#f5efe1;font-size:15px;margin-right:auto;opacity:.8}

.flying-note{position:fixed;z-index:45;width:80px;height:60px;color:var(--ink);pointer-events:none;will-change:transform,opacity}
.flying-note svg{width:100%;height:100%}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>

<div class="app">
<header class="masthead">
  <div class="mast-title">WiseJar</div>
  <div class="mast-sub">Drag a note up out of the jar — then let go to read it!</div>
</header>

<main id="stage" class="stage" aria-label="Scene with jar, fish bowl, paper and plant">
  <svg id="scene" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet" aria-hidden="false">

    <defs>
      <filter id="wob" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="4"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="1.4"></feDisplacementMap>
      </filter>
      <filter id="wob2" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="1.0"></feDisplacementMap>
      </filter>
      <clipPath id="bowlClip">
        <path d="M 220 410 L 460 410 Q 468 500 420 590 Q 400 628 340 630 Q 280 628 260 590 Q 212 500 220 410 Z"></path>
      </clipPath>
      <clipPath id="jarClip">
        <path d="M 558 290 C 548 330, 546 400, 550 480 C 554 560, 564 610, 580 626 L 760 626 C 776 610, 786 560, 790 480 C 794 400, 792 330, 782 290 Z"></path>
      </clipPath>
    </defs>

    <!-- Faint ruled paper background -->
    <g opacity="0.18" stroke="#7a5a34" stroke-width=".6">
      <line x1="0" y1="80" x2="1000" y2="80"></line><line x1="0" y1="150" x2="1000" y2="150"></line>
      <line x1="0" y1="220" x2="1000" y2="220"></line><line x1="0" y1="290" x2="1000" y2="290"></line>
      <line x1="0" y1="360" x2="1000" y2="360"></line><line x1="0" y1="430" x2="1000" y2="430"></line>
      <line x1="0" y1="500" x2="1000" y2="500"></line><line x1="0" y1="570" x2="1000" y2="570"></line>
      <line x1="0" y1="640" x2="1000" y2="640"></line><line x1="0" y1="710" x2="1000" y2="710"></line>
      <line x1="0" y1="780" x2="1000" y2="780"></line>
    </g>

    <!-- Table line -->
    <g stroke="#2a1a08" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#wob2)">
      <path d="M 90 632 q 180 6 420 0 q 260 -6 420 4"></path>
    </g>

    <!-- ─────── JAR (back-right) ─────── -->
    <g id="jar" class="clickable">
      <g stroke="#2a1a08" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)">
        <path d="M 558 270
                 C 548 310, 546 390, 550 480
                 C 554 560, 564 610, 580 626
                 L 760 626
                 C 776 610, 786 560, 790 480
                 C 794 390, 792 310, 782 270" fill="#fbf4e2" fill-opacity=".18"></path>
        <ellipse cx="670" cy="268" rx="112" ry="10" fill="#fbf4e2"></ellipse>
        <path d="M 558 240 v 28 a 112 10 0 0 0 224 0 v -28 a 112 12 0 0 0 -224 0 z" fill="#f5efe1"></path>
        <ellipse cx="670" cy="240" rx="112" ry="12" fill="#f5efe1"></ellipse>
        <g stroke-width="1.6">
          <line x1="572" y1="248" x2="578" y2="264"></line><line x1="587" y1="250" x2="593" y2="266"></line>
          <line x1="602" y1="251" x2="608" y2="267"></line><line x1="617" y1="251" x2="623" y2="267"></line>
          <line x1="632" y1="251" x2="638" y2="267"></line><line x1="647" y1="251" x2="653" y2="267"></line>
          <line x1="662" y1="251" x2="668" y2="267"></line><line x1="677" y1="251" x2="683" y2="267"></line>
          <line x1="692" y1="251" x2="698" y2="267"></line><line x1="707" y1="251" x2="713" y2="267"></line>
          <line x1="722" y1="251" x2="728" y2="267"></line><line x1="737" y1="250" x2="743" y2="266"></line>
          <line x1="752" y1="248" x2="758" y2="264"></line>
        </g>
        <path d="M 560 280 q 110 16 220 0"></path>
        <g stroke-width="1.4">
          <path d="M 562 288 q 6 14 12 0"></path><path d="M 574 288 q 6 14 12 0"></path>
          <path d="M 586 288 q 6 14 12 0"></path><path d="M 598 288 q 6 14 12 0"></path>
          <path d="M 610 288 q 6 14 12 0"></path><path d="M 622 288 q 6 14 12 0"></path>
          <path d="M 634 288 q 6 14 12 0"></path><path d="M 646 288 q 6 14 12 0"></path>
          <path d="M 658 288 q 6 14 12 0"></path><path d="M 670 288 q 6 14 12 0"></path>
          <path d="M 682 288 q 6 14 12 0"></path><path d="M 694 288 q 6 14 12 0"></path>
          <path d="M 706 288 q 6 14 12 0"></path><path d="M 718 288 q 6 14 12 0"></path>
          <path d="M 730 288 q 6 14 12 0"></path><path d="M 742 288 q 6 14 12 0"></path>
          <path d="M 754 288 q 6 14 12 0"></path><path d="M 766 288 q 6 14 12 0"></path>
        </g>
      </g>
      <!-- Notes pile inside jar (populated by JS) -->
      <g clip-path="url(#jarClip)" id="jar-pile"></g>
      <!-- Label text -->
      <g font-family="Caveat, cursive" fill="#2a1a08" pointer-events="none">
        <text x="670" y="400" text-anchor="middle" font-size="38" font-style="italic">WiseJar</text>
      </g>
      <!-- Hint label -->
      <g class="label-text" pointer-events="none">
        <text x="670" y="148" text-anchor="middle" font-family="Caveat, cursive" font-size="26" fill="#2a1a08" font-weight="500">
          <tspan x="670" dy="0">Drag a note up out of the jar —</tspan>
          <tspan x="670" dy="28">then let go to read it!</tspan>
        </text>
        <path d="M 670 192 l 0 26" stroke="#2a1a08" stroke-width="1.6" fill="none"></path>
        <path d="M 665 212 l 5 10 l 5 -10" stroke="#2a1a08" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      </g>
    </g>

    <!-- ─────── FISH BOWL ─────── -->
    <g id="fishbowl" class="clickable">
      <g stroke="#2a1a08" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)">
        <ellipse cx="340" cy="410" rx="120" ry="14" fill="#eaf5f6"></ellipse>
        <path d="M 220 410
                 Q 212 500 260 590
                 Q 280 628 340 630
                 Q 400 628 420 590
                 Q 468 500 460 410" fill="#eaf5f6" fill-opacity=".55"></path>
      </g>
      <g clip-path="url(#bowlClip)">
        <g stroke="#2a1a08" stroke-width="1.2" fill="none">
          <path class="wave wave1" d="M 210 440 q 15 -6 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0"></path>
          <path class="wave wave2" d="M 220 456 q 15 -4 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" opacity=".7"></path>
        </g>
        <g fill="none" stroke="#2a1a08" stroke-width="1">
          <circle class="bub b1" cx="310" cy="600" r="3"></circle>
          <circle class="bub b2" cx="325" cy="610" r="2"></circle>
          <circle class="bub b3" cx="300" cy="620" r="2.5"></circle>
          <circle class="bub b4" cx="365" cy="600" r="2"></circle>
        </g>
        <g stroke="#2a1a08" stroke-width="1.6" fill="none" stroke-linecap="round">
          <path d="M 270 624 q -8 -30 4 -60 q 4 14 0 30 q 8 -20 16 -30 q 0 20 -6 34"></path>
          <path d="M 330 624 q -4 -40 10 -70 q 0 18 -4 34 q 6 -14 14 -20 q -2 14 -8 28"></path>
          <path d="M 390 624 q -4 -24 6 -40 q 2 10 -2 22"></path>
        </g>
        <g stroke="#2a1a08" stroke-width="1.2" stroke-linejoin="round">
          <path d="M 262 622 q -2 -10 10 -12 q 14 -1 14 10 q -1 6 -8 8 q -12 2 -16 -6 z" fill="#c8b89a"></path>
          <path d="M 296 626 q -2 -10 14 -12 q 18 -1 20 10 q -1 8 -12 10 q -16 0 -22 -8 z" fill="#b59b7a"></path>
          <path d="M 340 626 q -2 -10 12 -12 q 14 -1 16 10 q -1 7 -10 9 q -14 1 -18 -7 z" fill="#d4c3a2"></path>
          <path d="M 382 624 q -2 -10 12 -12 q 14 -1 16 10 q -1 7 -10 9 q -14 1 -18 -7 z" fill="#a98f6e"></path>
        </g>
        <g id="food-layer" fill="#2a1a08" stroke="none"></g>
        <g id="fish-layer"></g>
      </g>
      <g pointer-events="none" font-family="Caveat, cursive" fill="#2a1a08">
        <text x="24" y="340" font-size="30" font-weight="500">click the bowl</text>
        <text x="24" y="374" font-size="30" font-weight="500">to feed the fish</text>
        <path d="M 210 358 q 30 6 38 38" stroke="#2a1a08" stroke-width="1.6" fill="none"></path>
        <path d="M 242 388 l 8 6 l -2 -10" stroke="#2a1a08" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      </g>
    </g>

    <!-- ─────── PAPER (foreground) ─────── -->
    <g id="paper" class="clickable">
      <g filter="url(#wob)">
        <path d="M 460 680 L 760 690 L 740 830 L 440 818 Z" fill="#fbf4e2" stroke="#2a1a08" stroke-width="2.2" stroke-linejoin="round"></path>
        <g fill="#2a1a08">
          <circle cx="570" cy="702" r="1.5"></circle><circle cx="580" cy="702" r="1.5"></circle><circle cx="590" cy="702" r="1.5"></circle><circle cx="600" cy="702" r="1.5"></circle>
          <circle cx="570" cy="712" r="1.5"></circle><circle cx="580" cy="712" r="1.5"></circle><circle cx="590" cy="712" r="1.5"></circle>
          <circle cx="570" cy="722" r="1.5"></circle><circle cx="580" cy="722" r="1.5"></circle>
          <circle cx="570" cy="732" r="1.5"></circle>
        </g>
      </g>
      <g font-family="Caveat, cursive" font-size="32" fill="#2a1a08" pointer-events="none" font-weight="500">
        <text x="130" y="750">What is the</text>
        <text x="130" y="786">best advice</text>
        <text x="130" y="822">you have received?</text>
        <path d="M 370 768 l 70 0" stroke="#2a1a08" stroke-width="1.8" fill="none"></path>
        <path d="M 432 760 l 12 8 l -12 8" stroke="#2a1a08" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      </g>
    </g>

    <!-- ─────── PEN ─────── -->
    <g id="pen" pointer-events="none">
      <g transform="rotate(-30)" stroke="#2a1a08" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob2)">
        <rect x="0" y="-5" width="80" height="10" fill="#f5efe1"></rect>
        <line x1="14" y1="-5" x2="14" y2="5"></line>
        <line x1="18" y1="-5" x2="18" y2="5"></line>
        <path d="M 80 -5 l 16 5 l -16 5 z" fill="#f5efe1"></path>
        <path d="M 4 -5 q 2 -6 8 -6 l 0 6"></path>
      </g>
    </g>

    <!-- ─────── PLANT (front-right) ─────── -->
    <g id="plant" pointer-events="none">
      <g stroke="#2a1a08" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob2)">
        <path d="M 810 770
                 C 776 756, 770 716, 796 700
                 L 874 700
                 C 900 716, 894 756, 860 770 Z" fill="#f5efe1"></path>
        <path d="M 790 728 q 40 12 80 0"></path>
        <path d="M 790 742 q 40 12 80 0" opacity=".7"></path>
        <path d="M 802 700 l 3 -14 l 52 0 l 3 14"></path>
      </g>
      <g class="plant-stems" stroke="#2a1a08" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob2)">
        <path d="M 835 686 q -30 -70 -48 -130"></path>
        <path d="M 835 686 q -4 -78 4 -146"></path>

<script>
/* ───── viewport height var (for mobile address-bar safe sizing) ───── */
(function(){function setVH(){document.documentElement.style.setProperty('--vh', window.innerHeight + 'px')}setVH();addEventListener('resize',setVH)})();

/* ═══════════════ WiseJar ═══════════════ */

/* 10 built-in default advices */
const SEED=[
"Most of what you worry about never actually happens.",
"Listen more than you speak. You already know what you think.",
"Start before you feel ready. You will never feel fully ready.",
"The people you surround yourself with shape who you become.",
"You cannot pour from an empty cup. Rest is not laziness.",
"Be the person you needed when you were younger.",
"Small consistent steps beat big inconsistent leaps every time.",
"What other people think of you is none of your business.",
"The days are long but the years are short.",
"Ask for help before you need it desperately."];

/* content filter */
const SWEARS=["fuck","shit","bitch","bastard","asshole","dick","cunt","piss","damn","crap","wanker","bollocks","twat"];
const SWEAR_RE=new RegExp('\\b('+SWEARS.join('|')+')\\b','gi');
const censor=t=>{let hit=false;const o=t.replace(SWEAR_RE,m=>{hit=true;return '*'.repeat(m.length)});return{text:o,hit}};
const wordCount=s=>{const t=(s||'').trim();return t?t.split(/\s+/).length:0};

/* paper palette for USER-added notes */
const NOTE_COLORS=['#fbf4e2','#f4e3c4','#efd9b8','#e9c9a6','#f2cfa8','#e5d3ae','#f6e7c1','#ead6c0','#efe0b8','#f0cfb0','#eac8b2'];
/* warm cream — default/built-in advice always uses this */
const DEFAULT_C='#fbf4e2';
/* default selected swatch for new user notes (distinct from cream so user notes stand out) */
const DEFAULT_USER_IDX=3;

/* ───── storage ───── */
const STORE='wisejar:v2';
const SEENKEY='wisejar:seen:v2';
const SEED_SET=new Set(SEED);
function seedNotes(){return SEED.map(t=>({t,c:DEFAULT_C}))}
function migrate(arr){return arr.map(x=>{const t=(typeof x==='string')?x:(x&&x.t)||'';const isSeed=SEED_SET.has(t);const c=isSeed?DEFAULT_C:((x&&x.c)||DEFAULT_C);return{t,c}})}
const save=n=>{try{localStorage.setItem(STORE,JSON.stringify(n))}catch(e){}};
const load=()=>{try{
  const r=localStorage.getItem(STORE);
  if(!r){const f=seedNotes();save(f);return f}
  const p=JSON.parse(r);
  if(!Array.isArray(p)||!p.length){const f=seedNotes();save(f);return f}
  const m=migrate(p);save(m);return m;
}catch(e){return seedNotes()}};
let NOTES=load();

/* ───── seen tracking (no repeats until all seen) ───── */
function loadSeen(){try{const r=localStorage.getItem(SEENKEY);const a=r?JSON.parse(r):[];return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveSeen(a){try{localStorage.setItem(SEENKEY,JSON.stringify(a))}catch(e){}}
let SEEN=loadSeen();
/* choose an advice the user hasn't seen yet; once all are seen, reset and start fresh */
function chooseUnseen(){
  if(!NOTES.length)return null;
  let unseen=NOTES.filter(n=>SEEN.indexOf(n.t)<0);
  if(!unseen.length){SEEN=[];saveSeen(SEEN);unseen=NOTES.slice()}
  return unseen[Math.floor(Math.random()*unseen.length)];
}
function markSeen(t){if(t&&SEEN.indexOf(t)<0){SEEN.push(t);saveSeen(SEEN)}}

const $=s=>document.querySelector(s);
function updateCounts(){drawPile()}

const SVG_NS='http://www.w3.org/2000/svg';
function rng(seed){let h=seed>>>0;return()=>{h=(h*1664525+1013904223)>>>0;return h/4294967295}}
function drawPile(){
  const pile=document.getElementById('jar-pile');if(!pile)return;
  pile.innerHTML='';
  const n=Math.min(NOTES.length,70);
  const r=rng(31+NOTES.length*7);
  const offset=Math.max(0,NOTES.length-n);
  const placements=[];
  for(let i=0;i<n;i++){
    const layer=Math.floor(i/4);
    const x=572+r()*196;
    const y=612-layer*26 - r()*8;
    const rot=(r()*60-30);
    const noteIdx=offset+i;
    placements.push({x,y,rot,c:(NOTES[noteIdx]&&NOTES[noteIdx].c)||DEFAULT_C,noteIdx});
  }
  placements.sort((a,b)=>a.y-b.y);
  placements.forEach((p)=>{
    const g=document.createElementNS(SVG_NS,'g');
    g.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.rot})`);
    g.setAttribute('data-note-idx',p.noteIdx);
    const path=document.createElementNS(SVG_NS,'path');
    path.setAttribute('d','M -27 -15 q 16 -3 54 0 l -1 30 q -26 3 -54 0 z');
    path.setAttribute('fill',p.c);
    path.setAttribute('stroke','#6b4a22');
    path.setAttribute('stroke-width','1.1');
    path.setAttribute('stroke-linejoin','round');
    path.setAttribute('stroke-linecap','round');
    g.appendChild(path);
    pile.appendChild(g);
  });
}
updateCounts();

/* ───── audio ───── */
let AC;
const getAC=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC};
const playScratch=()=>{const a=getAC();if(!a)return;const d=.08,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,1.5);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;const g=a.createGain();g.gain.value=.05;s.connect(f).connect(g).connect(a.destination);s.start()};
const playRustle=()=>{const a=getAC();if(!a)return;const d=.35,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1200;const g=a.createGain();g.gain.value=.08;s.connect(f).connect(g).connect(a.destination);s.start()};
const playPlop=()=>{const a=getAC();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(480,a.currentTime);o.frequency.exponentialRampToValueAtTime(160,a.currentTime+.15);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.08,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.22);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.25)};

/* ───── FISH (JS driven) ───── */
const fishLayer=document.getElementById('fish-layer');
function makeFish(cx,cy,scale=1){
  const g=document.createElementNS(SVG_NS,'g');
  g.setAttribute('class','fish-unit');
  const inner=document.createElementNS(SVG_NS,'g');
  inner.setAttribute('transform',`translate(-14 -6) scale(${scale})`);
  inner.innerHTML=`<g stroke="#2a1a08" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 6 q 14 -10 26 0 q -14 10 -26 0 z"/>
    <path d="M 26 6 l 7 -5 l 0 10 z"/>
    <circle cx="6" cy="5" r="1" fill="#2a1a08"/>
  </g>`;
  g.appendChild(inner);
  g.__state={x:cx,y:cy,tx:cx,ty:cy,dir:1,nextIdle:0};
  fishLayer.appendChild(g);
  return g;
}
const fishA=makeFish(320,490,1);
fishA.__state.idleSpeed=0.85;fishA.__state.chaseSpeed=2.2;fishA.__state.biasX=-10;fishA.__state.biasY=-15;fishA.__state.idleVar=2400;
const fishB=makeFish(390,540,0.80);
fishB.__state.idleSpeed=0.70;fishB.__state.chaseSpeed=1.8;fishB.__state.biasX=25;fishB.__state.biasY=20;fishB.__state.idleVar=3000;
/* Two new fish — different size, speed and zone */
const fishC=makeFish(295,468,0.62);
fishC.__state.idleSpeed=1.15;fishC.__state.chaseSpeed=2.7;fishC.__state.biasX=-28;fishC.__state.biasY=-38;fishC.__state.idleVar=1600;
const fishD=makeFish(408,528,0.95);
fishD.__state.idleSpeed=0.52;fishD.__state.chaseSpeed=1.4;fishD.__state.biasX=32;fishD.__state.biasY=18;fishD.__state.idleVar=3600;
const foodItems=[];
function pickIdleTarget(f){
  const bx=f.__state.biasX||0,by=f.__state.biasY||0;
  const cx=340+bx,cy=510+by,rx=66,ry=55;
  const a=Math.random()*Math.PI*2;const r=Math.random();
  f.__state.tx=cx+Math.cos(a)*rx*r;
  f.__state.ty=cy+Math.sin(a)*ry*r;
  f.__state.nextIdle=performance.now()+1400+Math.random()*(f.__state.idleVar||2400);
}
pickIdleTarget(fishA);pickIdleTarget(fishB);pickIdleTarget(fishC);pickIdleTarget(fishD);
function tick(){
  const now=performance.now();
  [fishA,fishB,fishC,fishD].forEach(f=>{
    const st=f.__state;
    let target=null,best=Infinity;
    for(const it of foodItems){
      if(it.eaten)continue;
      const d=Math.hypot(it.x-st.x,it.y-st.y);
      if(d<best){best=d;target=it}
    }
    if(target){st.tx=target.x;st.ty=target.y}
    else if(now>st.nextIdle||Math.hypot(st.tx-st.x,st.ty-st.y)<6){pickIdleTarget(f)}
    const dx=st.tx-st.x,dy=st.ty-st.y;const d=Math.hypot(dx,dy)||1;
    const speed=target?(f.__state.chaseSpeed||2.2):(f.__state.idleSpeed||0.9);
    st.x+=dx/d*Math.min(speed,d);
    st.y+=dy/d*Math.min(speed,d);
    st.dir=dx<0?-1:1;
    f.setAttribute('transform',`translate(${st.x} ${st.y}) scale(${st.dir} 1)`);
    if(target&&Math.hypot(target.x-st.x,target.y-st.y)<8){
      target.eaten=true;
      if(target.el)target.el.remove();
    }
  });
  for(let i=foodItems.length-1;i>=0;i--)if(foodItems[i].eaten)foodItems.splice(i,1);
  requestAnimationFrame(tick);
}
tick();

/* Click fishbowl → drop food at click position */
const bowlEl=document.getElementById('fishbowl');
const sceneEl=document.getElementById('scene');
function svgPoint(evt){
  const pt=sceneEl.createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;
  const m=sceneEl.getScreenCTM().inverse();return pt.matrixTransform(m);
}
bowlEl.addEventListener('click',(e)=>{
  const p=svgPoint(e);
  const fx=Math.max(240,Math.min(440,p.x));
  const fy=Math.max(430,Math.min(600,p.y));
  const foodLayer=document.getElementById('food-layer');
  for(let i=0;i<3;i++){
    const c=document.createElementNS(SVG_NS,'circle');
    const dx=(Math.random()*10-5);const dy=(Math.random()*6-3);
    const x=fx+dx,yStart=430+Math.random()*4,yEnd=fy+dy;
    c.setAttribute('r',1.8);c.setAttribute('cx',x);c.setAttribute('cy',yStart);
    foodLayer.appendChild(c);
    const item={x,y:yEnd,eaten:false,el:c};
    foodItems.push(item);
    const t0=performance.now();const dur=900+Math.random()*300;
    function sink(){const t=Math.min(1,(performance.now()-t0)/dur);const cy=yStart+(yEnd-yStart)*t;c.setAttribute('cy',cy);item.y=cy;if(t<1&&!item.eaten)requestAnimationFrame(sink)}
    sink();
  }
  playPlop();
});

/* ───── WRITE FLOW ───── */
const W=$('#write-overlay'),input=$('#advice-input'),mf=$('#meter-fill'),meter=$('.meter'),wc=$('#word-count'),warn=$('#warn'),toP=$('#to-preview'),pt=$('#preview-text');
let chosenColor=NOTE_COLORS[DEFAULT_USER_IDX];
(function buildSwatches(){
  const row=$('#color-swatches');if(!row)return;
  NOTE_COLORS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';b.className='swatch';b.style.background=c;b.setAttribute('aria-label','paper color '+(i+1));
    b.addEventListener('click',()=>{chosenColor=c;row.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');applyFoldedColor(c);applyPreviewColor(c)});
    if(i===DEFAULT_USER_IDX)b.classList.add('sel');
    row.appendChild(b);
  });
})();
function applyFoldedColor(c){const fn=document.getElementById('folded-note');if(!fn)return;fn.querySelectorAll('svg path').forEach((p,i)=>{if(i===0)p.setAttribute('fill',c)})}
function applyPreviewColor(c){const p=document.getElementById('preview-text');if(p)p.style.background=c}
applyFoldedColor(chosenColor);applyPreviewColor(chosenColor);
const setStep=n=>W.querySelectorAll('.paper-step').forEach(s=>s.hidden=s.dataset.step!==n);
const openW=()=>{W.classList.add('open');setStep('compose');input.value='';update();setTimeout(()=>input.focus(),300)};
const closeW=()=>W.classList.remove('open');
document.getElementById('paper').addEventListener('click',openW);
$('#cancel-write').addEventListener('click',closeW);
let lastScratch=0;
function update(){const n=wordCount(input.value);wc.textContent=n;mf.style.width=Math.min(100,n)+'%';if(n>100){meter.classList.add('over');warn.textContent='Please keep it to 100 words.';toP.disabled=true}else{meter.classList.remove('over');warn.textContent='';toP.disabled=!input.value.trim()}}
input.addEventListener('input',()=>{const n=wordCount(input.value);if(n>100){input.value=input.value.trim().split(/\s+/).slice(0,100).join(' ')}update();const t=performance.now();if(t-lastScratch>110){playScratch();lastScratch=t}});
toP.addEventListener('click',()=>{const raw=input.value.trim();const {hit}=censor(raw);if(hit){warn.textContent='Looks like your note contains some inappropriate language. Keep it kind and try again.';return}warn.textContent='';pt.textContent=raw;setStep('preview')});
$('#back-edit').addEventListener('click',()=>setStep('compose'));
$('#to-fold').addEventListener('click',()=>setStep('drop'));

/* drag note into jar (write) */
const folded=$('#folded-note'),miniJar=$('#mini-jar');
let wdrag=null;
const startDrag=e=>{const t=e.touches?e.touches[0]:e;const r=folded.getBoundingClientRect();wdrag={sx:t.clientX,sy:t.clientY,r};folded.classList.add('dragging');folded.style.position='fixed';folded.style.left=r.left+'px';folded.style.top=r.top+'px';folded.style.zIndex=60;document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',endDrag);document.addEventListener('touchmove',onDrag,{passive:false});document.addEventListener('touchend',endDrag);if(e.cancelable)e.preventDefault()};
const onDrag=e=>{if(!wdrag)return;const t=e.touches?e.touches[0]:e;const dx=t.clientX-wdrag.sx,dy=t.clientY-wdrag.sy;folded.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.min(14,dx/8)}deg)`;const jr=miniJar.getBoundingClientRect();const over=t.clientX>jr.left&&t.clientX<jr.right&&t.clientY>jr.top&&t.clientY<jr.bottom;miniJar.classList.toggle('over',over);if(e.cancelable)e.preventDefault()};
const endDrag=e=>{if(!wdrag)return;document.removeEventListener('mousemove',onDrag);document.removeEventListener('mouseup',endDrag);document.removeEventListener('touchmove',onDrag);document.removeEventListener('touchend',endDrag);const t=e.changedTouches?e.changedTouches[0]:e;const jr=miniJar.getBoundingClientRect();const over=t&&t.clientX>jr.left&&t.clientX<jr.right&&t.clientY>jr.top&&t.clientY<jr.bottom;folded.classList.remove('dragging');miniJar.classList.remove('over');if(over){commit()}else{folded.style.cssText=''}wdrag=null};
folded.addEventListener('mousedown',startDrag);
folded.addEventListener('touchstart',startDrag,{passive:false});
folded.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();commit()}});

const JAR_CAPACITY=50;
function commit(){
  const t=pt.textContent.trim();if(!t){setStep('compose');return}
  NOTES.push({t,c:chosenColor});            /* user note in chosen color, mixed into pool */
  save(NOTES);updateCounts();playRustle();
  folded.style.transition='transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s';
  folded.style.transform+=' scale(.3) rotate(20deg)';
  folded.style.opacity='0';
  setTimeout(()=>{folded.style.cssText='';setStep('thanks');if(NOTES.length>=JAR_CAPACITY){setTimeout(jarOverflowReset,900)}},480);
}
function jarOverflowReset(){
  const pile=document.getElementById('jar-pile');
  if(pile){
    pile.style.transition='transform .6s cubic-bezier(.4,0,.6,1),opacity .6s';
    pile.style.transformOrigin='670px 700px';
    pile.style.transform='translateY(40px) scale(.6)';
    pile.style.opacity='0';
  }
  setTimeout(()=>{
    NOTES=[];save(NOTES);
    SEEN=[];saveSeen(SEEN);
    if(pile){pile.style.transition='';pile.style.transform='';pile.style.opacity=''}
    updateCounts();
  },640);
}
$('#thanks-close').addEventListener('click',closeW);

/* ───── READ FLOW ───── */
const R=$('#read-overlay'),nt=$('#note-text');
function applyUnfoldedColor(c){const un=document.getElementById('unfolded-note');if(un)un.style.setProperty('--note-color',c||DEFAULT_C)}
function showAdvice(advice){
  if(!advice)return;
  markSeen(advice.t);
  applyUnfoldedColor(advice.c);
  nt.textContent=advice.t;
  R.classList.add('open');
  const un=$('#unfolded-note');un.style.animation='none';void un.offsetWidth;un.style.animation='';
}

/* drag-to-pull a note up out of the jar */
(function setupJarDrag(){
  const jarEl=document.getElementById('jar');
  if(!jarEl)return;
  let drag=null;
  function pickTopPileNote(){
    const pile=document.getElementById('jar-pile');
    const groups=pile?pile.querySelectorAll('g[data-note-idx]'):[];
    if(!groups.length)return null;
    const gi=groups.length-1-Math.floor(Math.random()*Math.min(5,groups.length));
    const g=groups[gi];
    return{g,path:g.querySelector('path')};
  }
  function makeFlyNote(color){
    const fly=document.createElement('div');fly.className='flying-note';
    fly.innerHTML=`<svg viewBox="0 0 120 80"><g fill="${color}" stroke="#6b4a22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M 8 10 q 30 -6 104 0 l -4 60 q -50 6 -104 0 z"/><path d="M 20 26 l 80 -2" opacity=".5"/><path d="M 20 38 l 72 -2" opacity=".5"/><path d="M 20 50 l 64 -2" opacity=".5"/></g></svg>`;
    return fly;
  }
  function onDown(e){
    if(drag)return;
    const pileNote=pickTopPileNote();if(!pileNote)return;       /* empty jar → nothing to pull */
    const cand=chooseUnseen();if(!cand)return;                  /* the advice that will be revealed */
    playRustle();
    pileNote.path.style.transition='opacity .15s';
    pileNote.path.style.opacity='0';
    const fly=makeFlyNote(cand.c);
    const jr=jarEl.getBoundingClientRect();
    const cx=(e.clientX||(e.touches&&e.touches[0].clientX))||(jr.left+jr.width*.5);
    const cy=(e.clientY||(e.touches&&e.touches[0].clientY))||(jr.top+jr.height*.35);
    const sx=cx-60,sy=cy-40;
    fly.style.left=sx+'px';fly.style.top=sy+'px';
    fly.style.transform='rotate(-6deg) scale(1)';
    fly.style.transition='none';
    fly.style.cursor='grabbing';
    document.body.appendChild(fly);
    document.body.classList.add('grabbing');
    drag={fly,sx,sy,cand,path:pileNote.path,startY:cy};
    e.preventDefault();
  }
  function onMove(e){
    if(!drag)return;
    const cx=(e.clientX||(e.touches&&e.touches[0].clientX));
    const cy=(e.clientY||(e.touches&&e.touches[0].clientY));
    if(cx==null||cy==null)return;
    const nx=cx-60,ny=cy-40;
    const dx=nx-drag.sx, dy=ny-drag.sy;
    const tilt=Math.max(-12,Math.min(12,dx*.05));
    drag.fly.style.transform=`translate(${dx}px,${dy}px) rotate(${-6+tilt}deg)`;
  }
  function onUp(){
    if(!drag)return;
    const d=drag;drag=null;
    document.body.classList.remove('grabbing');
    const flyRect=d.fly.getBoundingClientRect();
    const pulledUp=(d.startY-flyRect.top-40);
    if(pulledUp>50){
      const ex=innerWidth/2-60,ey=innerHeight/2-40;
      const curLeft=parseFloat(d.fly.style.left),curTop=parseFloat(d.fly.style.top);
      d.fly.style.transition='transform .55s cubic-bezier(.2,.8,.2,1),opacity .5s';
      d.fly.style.transform=`translate(${ex-curLeft}px,${ey-curTop}px) rotate(14deg) scale(1.5)`;
      d.fly.style.opacity='0';
      setTimeout(()=>{d.fly.remove()},560);
      setTimeout(()=>{ showAdvice(d.cand); },400);
    }else{
      /* snap back — note slips back into the jar, advice NOT marked seen */
      d.fly.style.transition='transform .35s cubic-bezier(.3,.9,.4,1),opacity .35s';
      d.fly.style.transform='translate(0,20px) rotate(-6deg)';
      d.fly.style.opacity='0';
      setTimeout(()=>{d.fly.remove();if(d.path){d.path.style.transition='opacity .25s';d.path.style.opacity=''}},360);
    }
  }
  jarEl.addEventListener('mousedown',onDown);
  jarEl.addEventListener('touchstart',onDown,{passive:false});
  addEventListener('mousemove',onMove);
  addEventListener('touchmove',onMove,{passive:false});
  addEventListener('mouseup',onUp);
  addEventListener('touchend',onUp);
})();
$('#read-close').addEventListener('click',()=>R.classList.remove('open'));
$('#draw-again').addEventListener('click',()=>{ showAdvice(chooseUnseen()); });

addEventListener('keydown',e=>{if(e.key==='Escape'){W.classList.remove('open');R.classList.remove('open')}});
document.querySelectorAll('.overlay-scrim').forEach(s=>s.addEventListener('click',()=>{W.classList.remove('open');R.classList.remove('open')}));
</script>
